server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  charset utf-8;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self' https://rns.stage0.xyz; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

  location = /openapi.yaml {
    default_type application/yaml;
    add_header Cache-Control "public, max-age=300";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self' https://rns.stage0.xyz; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "public, max-age=300";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self' https://rns.stage0.xyz; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    try_files $uri $uri/ /index.html;
  }
}
